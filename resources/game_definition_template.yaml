metadata:
  title: "New JETA Game"
  author: ""
  version: "0.1.0"
  description: "A short description of the game."
  language: "en"

intro:
  - page: "<p>Write the opening of the story here.</p>"

endings:
  - id: "victory"
    descriptions:
      - default: "<p>You unlocked the door. The end.</p>"

locations:
  - id: "room"
    name: "Room"
    descriptions:
      - default: "<p>You are in a small room.</p>"
      - condition: "key:owner = player"
        description: "<p>You are carrying the brass key.</p>"
    connections:
      - direction: "Hall"
        target: "hall"

  - id: "hall"
    name: "Hall"
    descriptions:
      - default: "<p>A locked door stands at the end of the hall.</p>"
    connections:
      - direction: "Room"
        target: "room"

items:
  - id: "key"
    name: "Brass key"
    name_accusative: "Brass key"
    owner: "room"
    movable: true
    descriptions:
      - default: "<p>A small brass key.</p>"
    onTake:
      - description: "<p>You take the key.</p>"

  - id: "door"
    name: "Locked door"
    owner: "hall"
    movable: false
    descriptions:
      - default: "<p>The door is locked.</p>"
    onUse:
      - condition: "player:location = hall && key:owner = player"
        description: "<p>The key turns and the door opens.</p>"
        set: "game_end = true; game_end_id = victory"
      - description: "<p>You need a key.</p>"

characters:
  - id: "player"
    name: "Player"
    location: "room"

variables: []
