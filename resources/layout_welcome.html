<div class="welcome">
    <style>
        body:has(.welcome) { background: #101c2a; }
        body:has(.welcome) #container { margin: 0 !important; }
        body:has(.welcome) #container > .row,
        body:has(.welcome) #container > .text-center { display: none; }
        .welcome { --paper: #f4f1e8; --ink: #172536; --muted: #586371; --accent: #e6ee9b; min-height: 100vh; padding: clamp(20px, 4vw, 48px); background: radial-gradient(ellipse at 100% 0, #293c49, transparent 65%), #101c2a; color: var(--paper); font: 16px/1.6 "Segoe UI", sans-serif; }
        .welcome * { box-sizing: border-box; }
        .welcome .shell { max-width: 1160px; margin: auto; }
        .welcome .brand-row { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 28px; }
        .welcome .brand { font-weight: 700; font-size: 13px; letter-spacing: .16em; margin: 0; }
        .welcome .badge { border: 1px solid #6b7b7c; border-radius: 30px; padding: 5px 12px; font-size: 10px; letter-spacing: .1em; color: var(--accent); }
        .welcome .hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; align-items: center; margin-bottom: 30px; }
        .welcome #game-title { font: 400 clamp(34px, 4.2vw, 58px)/1.08 Georgia, serif; max-width: 650px; margin: 0; letter-spacing: -.03em; }
        .welcome .about { color: #c2ccd3; margin: 0; max-width: 440px; }
        .welcome .getting-started { background: var(--accent); color: var(--ink); border-radius: 16px; padding: 24px 28px; margin-bottom: 28px; }
        .welcome .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
        .welcome .step { display: grid; grid-template-columns: 32px 1fr; gap: 12px; }
        .welcome .number { font: 400 24px/1.3 Georgia, serif; opacity: .65; }
        .welcome h2 { font-size: 12px; letter-spacing: .13em; text-transform: uppercase; margin: 0 0 16px; }
        .welcome h3 { font-size: 20px; margin: 0 0 6px; }
        .welcome p { margin: 0 0 12px; }
        .welcome p:last-child { margin-bottom: 0; }
        .welcome .sample { font-size: 13px; margin-top: 8px; color: #43502a; }
        .welcome .play-area { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(260px, 1fr); gap: 24px; align-items: start; }
        .welcome .scene { background: var(--paper); color: var(--ink); border-radius: 16px; padding: 28px; }
        .welcome .scene h2 { color: var(--muted); }
        .welcome #game-location { font-size: 17px; }
        .welcome #game-location h3 { font: 400 28px/1.25 Georgia, serif; margin-bottom: 14px; }
        .welcome .controls { border: 1px solid #506070; border-radius: 16px; padding: 24px; }
        .welcome .controls h2 { color: #c2ccd3; }
        .welcome a { color: var(--accent); text-underline-offset: 4px; overflow-wrap: anywhere; }
        .welcome a:hover { color: #fff; }
        .welcome a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
        .welcome #game-commands { margin-bottom: 14px; }
        .welcome #game-items, .welcome #game-use { margin-bottom: 12px; }
        /* This immovable-button story has no inventory; hide the engine's empty inventory label. */
        .welcome #game-items { font-size: 0; }
        .welcome #game-items span, .welcome #game-items a { font-size: 16px; margin-right: 4px; }
        .welcome #game-use a { display: inline-block; background: var(--accent); color: var(--ink); border-radius: 8px; padding: 10px 16px; text-decoration: none; font-weight: 600; margin-top: 6px; }
        .welcome #game-use a:hover { background: #f5ffb5; }
        .welcome .hint { color: #c2ccd3; font-size: 13px; border-top: 1px solid #506070; padding-top: 14px; margin-top: 18px; }
        .welcome .journal { padding: 22px 4px 0; }
        .welcome .journal h2 { color: #c2ccd3; margin-bottom: 8px; }
        .welcome #game-output { max-height: 220px; overflow-y: auto; scrollbar-color: #728387 #101c2a; }
        .welcome #game-output:empty::before { content: attr(data-empty-text); color: #a9b7c3; font-size: 14px; }
        .welcome #game-output > div { padding: 12px 0; border-bottom: 1px solid #394956; }
        .welcome footer { color: #a9b7c3; font-size: 12px; margin-top: 30px; border-top: 1px solid #394956; padding-top: 14px; }
        @media (max-width: 800px) {
            .welcome .hero { grid-template-columns: 1fr; gap: 20px; }
            .welcome .about { max-width: none; }
            .welcome .steps { gap: 20px; }
            .welcome .play-area { grid-template-columns: 1fr; }
        }
        @media (max-width: 520px) {
            .welcome .badge { display: none; }
            .welcome .steps { grid-template-columns: 1fr; }
            .welcome .getting-started, .welcome .scene, .welcome .controls { padding: 22px; }
        }
    </style>
    <div class="shell">
        <header>
            <div class="brand-row">
                <p class="brand" data-game-text="brand"></p>
                <span class="badge" data-game-text="badge"></span>
            </div>
            <div class="hero">
                <h1 id="game-title"></h1>
                <p class="about" data-game-text="about"></p>
            </div>
        </header>
        <section class="getting-started" data-game-label="start">
            <h2 data-game-text="start"></h2>
            <div class="steps">
                <div class="step">
                    <span class="number" aria-hidden="true">01</span>
                    <div>
                        <h3 data-game-text="open"></h3>
                        <p data-game-text="openHint"></p>
                        <p class="sample" data-game-text="sample"></p>
                    </div>
                </div>
                <div class="step">
                    <span class="number" aria-hidden="true">02</span>
                    <div>
                        <h3 data-game-text="create"></h3>
                        <p data-game-text="createHint"></p>
                    </div>
                </div>
            </div>
        </section>
        <main class="play-area">
            <section class="scene" data-game-label="scene">
                <h2 data-game-text="scene"></h2>
                <div id="game-location"></div>
            </section>
            <aside class="controls" data-game-label="controls">
                <h2 data-game-text="controls"></h2>
                <div id="game-commands"></div>
                <div id="game-items"></div>
                <div id="game-use"></div>
                <div id="game-characters"></div>
                <div id="game-take"></div>
                <div id="game-drop"></div>
                <div id="game-go"></div>
                <p class="hint" data-game-text="hint"></p>
            </aside>
        </main>
        <section class="journal" data-game-label="journal">
            <h2 id="game-log-title" data-game-text="journal"></h2>
            <div id="game-output" role="log" data-game-label="journal" data-game-empty="empty" tabindex="0"></div>
        </section>
        <footer data-game-text="footer"></footer>
    </div>
</div>
